<!-- @dsCard group="Colors" viewport="700x150" name="Analysis stage & orientation states" subtitle="Sage done, slate current, red failed, amber skipped" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:18px;background:var(--obs-canvas);font-family:var(--font-sans);color:var(--obs-ink)}.sw{display:flex;gap:0;border:1px solid var(--obs-border);border-radius:var(--radius-lg);overflow:hidden}.sw div{flex:1;padding:10px 12px;font-size:11px;font-family:var(--font-mono)}.grid{display:flex;flex-wrap:wrap;gap:12px}.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px}.dot{width:9px;height:9px;border-radius:999px;display:inline-block;position:relative}</style></head><body>
<div class="sw">
<div style="background:color-mix(in srgb,var(--stage-done) 14%,var(--obs-paper))">done · var(--stage-done)</div>
<div style="background:color-mix(in srgb,var(--stage-current) 12%,var(--obs-paper))">current · var(--stage-current)</div>
<div style="background:color-mix(in srgb,var(--stage-failed) 10%,var(--obs-paper))">failed · #b91c1c</div>
<div style="background:color-mix(in srgb,var(--stage-skipped) 10%,var(--obs-paper))">skipped · #b45309</div>
<div style="background:color-mix(in srgb,var(--orientation-ready) 10%,var(--obs-paper))">orientation ready · #047857</div>
</div></body></html>
