<!-- @dsCard group="Colors" viewport="700x150" name="Evidence status dots" subtitle="Shape carries meaning so color never has to" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:18px;background:var(--obs-canvas);font-family:var(--font-sans);color:var(--obs-ink)}.sw{display:flex;gap:0;border:1px solid var(--obs-border);border-radius:var(--radius-lg);overflow:hidden}.sw div{flex:1;padding:10px 12px;font-size:11px;font-family:var(--font-mono)}.grid{display:flex;flex-wrap:wrap;gap:12px}.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px}.dot{width:9px;height:9px;border-radius:999px;display:inline-block;position:relative}</style></head><body>
<div class="grid" style="gap:18px">
<span class="chip"><i class="dot" style="background:var(--status-verified)"></i>Verified</span>
<span class="chip"><i class="dot" style="background:linear-gradient(90deg,var(--obs-clay) 0 50%,transparent 50% 100%);border:1px solid var(--obs-clay)"></i>Partial / Insufficient</span>
<span class="chip"><i class="dot" style="border:1.4px solid var(--obs-stone)"></i>Candidate</span>
<span class="chip"><i class="dot" style="border:1.4px dashed var(--obs-stone)"></i>Inferred</span>
<span class="chip"><i class="dot" style="border:1.3px solid var(--obs-muted-red)"></i>Unsupported</span>
<span class="chip"><i class="dot" style="border:1.3px solid var(--obs-stone);box-shadow:inset 3px 0 0 var(--obs-stone)"></i>Stale</span>
<span class="chip"><i class="dot" style="background:color-mix(in srgb,var(--obs-stone) 65%,transparent);border:1.3px solid var(--obs-stone)"></i>Legacy</span>
</div></body></html>
