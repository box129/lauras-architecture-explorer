<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:18px;background:var(--obs-canvas);font-family:var(--font-sans);color:var(--obs-ink)}.sw{display:flex;gap:0;border:1px solid var(--obs-border);border-radius:var(--radius-lg);overflow:hidden}.sw div{flex:1;padding:10px 12px;font-size:11px;font-family:var(--font-mono)}.grid{display:flex;flex-wrap:wrap;gap:12px}.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px}.dot{width:9px;height:9px;border-radius:999px;display:inline-block;position:relative}</style></head><body>
<div class="sw">
<div style="background:var(--obs-canvas)">--obs-canvas<br>#F8F5F1</div>
<div style="background:var(--obs-paper)">--obs-paper<br>#FCFAF7</div>
<div style="background:var(--obs-white)">--obs-white<br>#FFFFFF</div>
<div style="background:var(--obs-border)">--obs-border<br>#DED8CF</div>
<div style="background:var(--obs-stone);color:var(--obs-white)">--obs-stone<br>#625F59</div>
<div style="background:var(--obs-ink);color:var(--obs-paper)">--obs-ink<br>#1A1916</div>
</div></body></html>
