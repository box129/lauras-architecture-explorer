<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:18px;background:var(--obs-canvas);font-family:var(--font-sans);color:var(--obs-ink)}.sw{display:flex;gap:0;border:1px solid var(--obs-border);border-radius:var(--radius-lg);overflow:hidden}.sw div{flex:1;padding:10px 12px;font-size:11px;font-family:var(--font-mono)}.grid{display:flex;flex-wrap:wrap;gap:12px}.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px}.dot{width:9px;height:9px;border-radius:999px;display:inline-block;position:relative}</style></head><body>
<div class="grid"><div style="width:118px;height:82px;background:var(--obs-paper);border:1px solid var(--obs-border);border-radius:12px;box-shadow:var(--shadow-node);display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;color:var(--obs-stone)">node</div><div style="width:118px;height:82px;background:var(--obs-paper);border:1px solid var(--obs-border);border-radius:12px;box-shadow:var(--shadow-card);display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;color:var(--obs-stone)">card</div><div style="width:118px;height:82px;background:var(--obs-paper);border:1px solid var(--obs-border);border-radius:12px;box-shadow:var(--shadow-panel);display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;color:var(--obs-stone)">panel</div><div style="width:118px;height:82px;background:var(--obs-paper);border:1px solid var(--obs-border);border-radius:12px;box-shadow:var(--shadow-dock);display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;color:var(--obs-stone)">dock</div><div style="width:118px;height:82px;background:var(--obs-paper);border:1px solid var(--obs-border);border-radius:12px;box-shadow:var(--shadow-modal);display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;color:var(--obs-stone)">modal</div></div></body></html>
