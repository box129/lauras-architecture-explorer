<!-- @dsCard group="Brand" viewport="700x160" name="Motion" subtitle="One curve, three durations. Hover lifts 3.5%; nothing bounces" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:18px;background:var(--obs-canvas);font-family:var(--font-sans);color:var(--obs-ink)}.sw{display:flex;gap:0;border:1px solid var(--obs-border);border-radius:var(--radius-lg);overflow:hidden}.sw div{flex:1;padding:10px 12px;font-size:11px;font-family:var(--font-mono)}.grid{display:flex;flex-wrap:wrap;gap:12px}.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px}.dot{width:9px;height:9px;border-radius:999px;display:inline-block;position:relative}</style></head><body>
<div style="font-family:var(--font-mono);font-size:12px;color:var(--obs-stone)">--obs-ease: cubic-bezier(0.16, 1, 0.3, 1)</div>
<div class="grid" style="margin-top:12px">
<span class="chip" style="font-family:var(--font-mono);font-size:11px">micro 120ms</span>
<span class="chip" style="font-family:var(--font-mono);font-size:11px">layout 280ms</span>
<span class="chip" style="font-family:var(--font-mono);font-size:11px">surface 520ms</span>
<span class="chip" style="font-family:var(--font-mono);font-size:11px">hover scale(1.035)</span>
<span class="chip" style="font-family:var(--font-mono);font-size:11px">press translateY(-1px)</span>
</div></body></html>
