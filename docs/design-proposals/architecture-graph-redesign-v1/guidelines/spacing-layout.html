<!-- @dsCard group="Spacing" viewport="700x170" name="Fixed layout metrics" subtitle="48px top bar, 360px voice rail, 238px node" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:18px;background:var(--obs-canvas);font-family:var(--font-sans);color:var(--obs-ink)}.sw{display:flex;gap:0;border:1px solid var(--obs-border);border-radius:var(--radius-lg);overflow:hidden}.sw div{flex:1;padding:10px 12px;font-size:11px;font-family:var(--font-mono)}.grid{display:flex;flex-wrap:wrap;gap:12px}.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px}.dot{width:9px;height:9px;border-radius:999px;display:inline-block;position:relative}</style></head><body>
<div style="border:1px solid var(--obs-border);border-radius:10px;overflow:hidden;background:var(--obs-paper)">
<div style="height:48px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--obs-border);font-size:12px;color:var(--obs-stone)">--topbar-height 48px</div>
<div style="display:grid;grid-template-columns:minmax(0,1fr) 200px;height:86px">
<div style="display:grid;place-items:center;font-size:12px;color:var(--obs-stone);border-right:1px solid var(--obs-border)">map canvas · node 238×104</div>
<div style="display:grid;place-items:center;font-size:12px;color:var(--obs-stone);background:rgba(252,250,247,.76)">rail 360px</div>
</div></div></body></html>
