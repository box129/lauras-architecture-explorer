<!-- @dsCard group="Theme" viewport="700x210" name="Epistemic layer tokens" subtitle="structural / cluster / ai / verification — light and dark" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:18px;background:var(--bg-app);font-family:var(--font-sans);color:var(--text-primary)}.sw{display:flex;border:1px solid var(--border-default2);border-radius:8px;overflow:hidden}.sw div{flex:1;padding:10px 12px;font-size:10.5px;font-family:var(--font-mono)}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}</style></head><body><div class="pair">
<div data-theme="light" style="padding:12px;background:var(--bg-app);border:1px solid var(--border-default2);border-radius:8px">
<div style="margin-bottom:8px;color:var(--text-muted);font-size:11px;font-weight:680;letter-spacing:.04em;text-transform:uppercase">light</div>
<div style="display:grid;gap:6px;font-size:11px">
<div style="padding:8px 10px;background:var(--structural-container-bg);border:1.5px solid var(--structural-container-border);border-radius:8px">structural.container</div>
<div style="padding:8px 10px;background:var(--structural-cluster-bg);border:1px solid var(--structural-cluster-border);border-radius:4px;color:var(--structural-cluster-accent)">structural.cluster</div>
<div style="padding:8px 10px;background:var(--ai-surface);border:1px solid var(--ai-border);border-radius:999px;color:var(--ai-text)">ai.surface / ai.border / ai.text</div>
<div style="padding:8px 10px;background:var(--verification-supported-bg);border-left:3px solid var(--verification-supported);border-radius:4px">verification.supported</div>
<div style="padding:8px 10px;background:var(--verification-contradicted-bg);border-left:3px solid var(--verification-contradicted);border-radius:4px">verification.contradicted</div>
</div></div><div data-theme="dark" style="padding:12px;background:var(--bg-app);border:1px solid var(--border-default2);border-radius:8px">
<div style="margin-bottom:8px;color:var(--text-muted);font-size:11px;font-weight:680;letter-spacing:.04em;text-transform:uppercase">dark</div>
<div style="display:grid;gap:6px;font-size:11px">
<div style="padding:8px 10px;background:var(--structural-container-bg);border:1.5px solid var(--structural-container-border);border-radius:8px">structural.container</div>
<div style="padding:8px 10px;background:var(--structural-cluster-bg);border:1px solid var(--structural-cluster-border);border-radius:4px;color:var(--structural-cluster-accent)">structural.cluster</div>
<div style="padding:8px 10px;background:var(--ai-surface);border:1px solid var(--ai-border);border-radius:999px;color:var(--ai-text)">ai.surface / ai.border / ai.text</div>
<div style="padding:8px 10px;background:var(--verification-supported-bg);border-left:3px solid var(--verification-supported);border-radius:4px">verification.supported</div>
<div style="padding:8px 10px;background:var(--verification-contradicted-bg);border-left:3px solid var(--verification-contradicted);border-radius:4px">verification.contradicted</div>
</div></div>
</div></body></html>
