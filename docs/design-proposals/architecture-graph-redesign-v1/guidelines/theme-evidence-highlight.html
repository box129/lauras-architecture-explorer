<!-- @dsCard group="Theme" viewport="700x170" name="Evidence highlight" subtitle="Supporting lines stay legible in both themes" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:18px;background:var(--bg-app);font-family:var(--font-sans);color:var(--text-primary)}.sw{display:flex;border:1px solid var(--border-default2);border-radius:8px;overflow:hidden}.sw div{flex:1;padding:10px 12px;font-size:10.5px;font-family:var(--font-mono)}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}</style></head><body><div class="pair">
<div data-theme="light" style="overflow:hidden;border:1px solid var(--border-default2);border-radius:8px">
<pre style="margin:0;padding:10px 0;background:var(--bg-code);color:var(--text-oncode);font-family:var(--font-mono);font-size:11.5px;line-height:1.7">
<div style="padding:0 12px"><span style="color:var(--text-oncode-dim)">117 </span>const token = await issueToken(user);</div>
<div style="padding:0 12px;background:var(--evidence-highlight);box-shadow:inset 3px 0 0 var(--evidence-highlight-edge)"><span style="color:var(--text-oncode-dim)">118 </span>await notification.send({</div>
<div style="padding:0 12px;background:var(--evidence-highlight);box-shadow:inset 3px 0 0 var(--evidence-highlight-edge)"><span style="color:var(--text-oncode-dim)">119 </span>  to: user.email,</div>
<div style="padding:0 12px"><span style="color:var(--text-oncode-dim)">120 </span>});</div>
</pre></div><div data-theme="dark" style="overflow:hidden;border:1px solid var(--border-default2);border-radius:8px">
<pre style="margin:0;padding:10px 0;background:var(--bg-code);color:var(--text-oncode);font-family:var(--font-mono);font-size:11.5px;line-height:1.7">
<div style="padding:0 12px"><span style="color:var(--text-oncode-dim)">117 </span>const token = await issueToken(user);</div>
<div style="padding:0 12px;background:var(--evidence-highlight);box-shadow:inset 3px 0 0 var(--evidence-highlight-edge)"><span style="color:var(--text-oncode-dim)">118 </span>await notification.send({</div>
<div style="padding:0 12px;background:var(--evidence-highlight);box-shadow:inset 3px 0 0 var(--evidence-highlight-edge)"><span style="color:var(--text-oncode-dim)">119 </span>  to: user.email,</div>
<div style="padding:0 12px"><span style="color:var(--text-oncode-dim)">120 </span>});</div>
</pre></div>
</div></body></html>
