<!-- @dsCard group="Theme" viewport="700x150" name="Surfaces" subtitle="background.app / canvas / surface / elevated / sunken — themed" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:18px;background:var(--bg-app);font-family:var(--font-sans);color:var(--text-primary)}.sw{display:flex;border:1px solid var(--border-default2);border-radius:8px;overflow:hidden}.sw div{flex:1;padding:10px 12px;font-size:10.5px;font-family:var(--font-mono)}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}</style></head><body><div class="pair">
<div data-theme="light" style="padding:12px;background:var(--bg-app);border:1px solid var(--border-default2);border-radius:8px"><div>
<div style="margin-bottom:6px;color:var(--text-muted);font-size:11px;font-weight:680;letter-spacing:.04em;text-transform:uppercase">Light</div>
<div class="sw"><div style="background:var(--bg-app);color:var(--text-primary)">bg-app</div><div style="background:var(--bg-surface);color:var(--text-primary)">bg-surface</div><div style="background:var(--bg-elevated);color:var(--text-primary)">bg-elevated</div><div style="background:var(--bg-sunken);color:var(--text-primary)">bg-sunken</div></div></div></div>
<div data-theme="dark" style="padding:12px;background:var(--bg-app);border:1px solid var(--border-default2);border-radius:8px"><div>
<div style="margin-bottom:6px;color:var(--text-muted);font-size:11px;font-weight:680;letter-spacing:.04em;text-transform:uppercase">Dark</div>
<div class="sw"><div style="background:var(--bg-app);color:var(--text-primary)">bg-app</div><div style="background:var(--bg-surface);color:var(--text-primary)">bg-surface</div><div style="background:var(--bg-elevated);color:var(--text-primary)">bg-elevated</div><div style="background:var(--bg-sunken);color:var(--text-primary)">bg-sunken</div></div></div></div>
</div></body></html>
