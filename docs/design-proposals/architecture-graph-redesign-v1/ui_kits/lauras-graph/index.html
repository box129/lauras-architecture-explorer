<!-- @dsCard group="Laura's redesign" viewport="1440x900" name="Laura's — architecture-first graph" subtitle="Architecture lens: structural regions + deterministic clusters + optional AI labels + aggregated real relations" -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Laura's — architecture-first graph</title>
  <link rel="stylesheet" href="../../styles.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script src="../lauras-redesign/theme.js"></script>
  <script src="./graph-data.js"></script>
  <style>
    html,body{margin:0;height:100%}body{background:var(--bg-app);color:var(--text-primary);font-family:var(--font-sans)}#root{height:100vh}*{box-sizing:border-box}
    button,input,select{font:inherit}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./GraphCanvas.jsx"></script>
<script type="text/babel" src="./GraphScreens.jsx"></script>
<script type="text/babel">
const { Icon, Button, ThemeToggle, ProvenanceChip, AIInterpretationCard } = window.SyntaxTreeDesignSystem_b1a4e9;
const G = window.GraphData;

const MOCKUPS = [
  { id: 'm1', label: '1 · Architecture map — Dark + AI', apply: { theme: 'dark', scope: null, sel: null, zoom: 0.82, view: 'map', ai: true } },
  { id: 'm2', label: '2 · Architecture map — Light + AI', apply: { theme: 'light', scope: null, sel: null, zoom: 0.82, view: 'map', ai: true } },
  { id: 'm3', label: '3 · Deterministic only', apply: { theme: 'dark', scope: null, sel: null, zoom: 0.82, view: 'map', ai: false } },
  { id: 'm4', label: '4 · Application Services selected', apply: { theme: 'dark', scope: null, sel: 'services', zoom: 0.86, view: 'map', ai: true } },
  { id: 'm5', label: '5 · Services area entered', apply: { theme: 'dark', scope: 'services', sel: 'c1', view: 'map', ai: true } },
  { id: 'm6', label: '6 · Cluster drill-down', apply: { theme: 'dark', scope: 'c1', sel: 'c1', view: 'map', ai: true } },
  { id: 'm7', label: '7 · Entity focus', apply: { theme: 'dark', entity: true, ai: true } },
  { id: 'm8', label: '8 · 2,000-module scale', apply: { theme: 'dark', large: true } },
  { id: 'm9', label: '9 · 1366×768 architecture', apply: { theme: 'dark', scope: null, sel: null, zoom: 0.70, view: 'map', ai: true, narrowDemo: true } },
  { id: 'm10', label: '10 · Map + Outline', apply: { theme: 'dark', scope: null, sel: 'services', zoom: 0.80, view: 'split', ai: true } }
];

function App() {
  const [theme, setThemeState] = React.useState('dark');
  React.useEffect(() => { window.LaurasTheme.write('dark'); }, []);
  const setTheme = (v) => { window.LaurasTheme.write(v); setThemeState(v); };

  const [zoom, setZoom] = React.useState(0.82);
  const [view, setView] = React.useState('map');
  const [filter, setFilter] = React.useState('strong');
  const [selected, setSelected] = React.useState(null);
  const [stack, setStack] = React.useState([{ id: null, label: 'Architecture overview' }]);
  const [aiOn, setAIOn] = React.useState(true);
  const [mini, setMini] = React.useState(true);
  const [inspector, setInspector] = React.useState(true);
  const [entity, setEntity] = React.useState(null);
  const [large, setLarge] = React.useState(false);
  const [query, setQuery] = React.useState('');
  const [found, setFound] = React.useState(null);
  const [narrowDemo, setNarrowDemo] = React.useState(false);

  const top = stack[stack.length - 1];
  const scope = top.id;
  const node = selected ? G.byId[selected] : null;
  const zoomBy = (d) => setZoom((z) => Math.min(1.35, Math.max(0.48, Math.round((z + d * 0.14) * 100) / 100)));
  const fit = () => setZoom(narrowDemo ? 0.66 : 0.76);
  const enter = (n) => {
    if (!n || n.kind === 'residual') return;
    setStack((s) => [...s, { id: n.id, label: aiOn && n.ai ? n.ai.name : n.label }]);
    setSelected(n.id);
    setEntity(null);
  };
  const back = () => {
    setStack((s) => (s.length > 1 ? s.slice(0, -1) : s));
    setEntity(null);
    setSelected(null);
  };
  const openModule = (name) => {
    setEntity({ ...G.entity, label: name, id: name });
    setStack((s) => [...s, { id: '__entity', label: name }]);
  };

  const runMockup = (m) => {
    const a = m.apply;
    if (a.theme) setTheme(a.theme);
    setLarge(!!a.large);
    setEntity(a.entity ? G.entity : null);
    setNarrowDemo(!!a.narrowDemo);
    if (a.zoom) setZoom(a.zoom);
    if (a.view) setView(a.view);
    if (typeof a.ai === 'boolean') setAIOn(a.ai);
    setSelected(a.sel || null);
    setStack(a.entity
      ? [{ id: null, label: 'Architecture overview' }, { id: 'services', label: 'Application Services' }, { id: 'c1', label: 'Authentication & Sessions' }, { id: '__entity', label: G.entity.label }]
      : a.scope
        ? [{ id: null, label: 'Architecture overview' }, { id: a.scope, label: G.byId[a.scope] && G.byId[a.scope].ai && a.ai ? G.byId[a.scope].ai.name : G.byId[a.scope].label }]
        : [{ id: null, label: 'Architecture overview' }]);
  };

  const search = (ev) => {
    ev.preventDefault();
    const q = query.trim().toLowerCase();
    if (!q) return;
    const nodeHit = G.nodes.find((n) => n.label.toLowerCase().includes(q) || (n.ai && n.ai.name.toLowerCase().includes(q)) || (n.path && n.path.toLowerCase().includes(q)));
    if (nodeHit) {
      setLarge(false); setEntity(null); setStack([{ id: null, label: 'Architecture overview' }]); setZoom(0.98); setSelected(nodeHit.id); setView('map'); return;
    }
    const hit = G.modules.find((m) => m.name.toLowerCase().includes(q));
    if (!hit) return;
    setLarge(false); setEntity(null); setStack([{ id: null, label: 'Architecture overview' }]);
    setZoom(1.05); setFound(hit.name); setSelected(hit.parent); setView('map');
  };

  const controls = <GraphControls zoom={zoom} onZoom={zoomBy} onFit={fit} filter={filter} onFilter={setFilter}
    view={view} onView={setView} mini={mini} onMini={() => setMini((m) => !m)} aiOn={aiOn} onAI={() => setAIOn((v) => !v)} />;

  let canvas;
  if (large) canvas = <LargeRepoMap />;
  else if (entity) canvas = <EntityGraph entity={entity} />;
  else if (scope && G.byId[scope] && G.byId[scope].kind === 'cluster') canvas = <GroupGraph group={G.byId[scope]} aiOn={aiOn} foundModule={found} onOpenModule={openModule} />;
  else if (scope && G.byId[scope] && G.byId[scope].kind === 'area' && G.childrenOf(scope).some((n) => n.kind === 'cluster')) canvas = <AreaGraph area={G.byId[scope]} aiOn={aiOn} selected={selected} onSelect={setSelected} onEnter={enter} />;
  else if (scope && G.byId[scope] && G.byId[scope].members) canvas = <GroupGraph group={G.byId[scope]} aiOn={aiOn} foundModule={found} onOpenModule={openModule} />;
  else canvas = <MapCanvas zoom={zoom} filter={filter} selected={selected} onSelect={setSelected} onEnter={enter} aiOn={aiOn} foundModule={found} onOpenModule={openModule} mini={mini} controls={controls} scope={scope} />;

  if (view === 'outline') canvas = <OutlinePane selected={selected} onSelect={setSelected} aiOn={aiOn} />;
  else if (view === 'split') canvas = (
    <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1fr) 300px', minWidth: 0, minHeight: 0 }}>
      {canvas}
      <div style={{ minWidth: 0, borderLeft: '1px solid var(--border-default2)' }}><OutlinePane compactHeader selected={selected} onSelect={setSelected} aiOn={aiOn} /></div>
    </div>
  );

  return (
    <div style={{ display: 'grid', gridTemplateRows: '52px 42px minmax(0,1fr)', height: '100%', maxWidth: narrowDemo ? 1366 : 'none', margin: '0 auto', boxShadow: narrowDemo ? '0 0 0 1px var(--border-default2)' : 'none' }}>
      <header style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '0 16px', background: 'var(--bg-surface)', borderBottom: '1px solid var(--border-default2)' }}>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8, flex: 'none', fontSize: 15, fontWeight: 700 }}><span style={{ display: 'inline-flex', color: 'var(--arch-blue)' }}><Icon name="git-branch" size={18} /></span>Laura&rsquo;s</span>
        <nav style={{ display: 'flex', alignItems: 'center', gap: 3, flex: 'none' }}>
          {[['Architecture', 'network'], ['Clusters', 'waypoints'], ['Dependencies', 'workflow']].map(([label, icon], i) => (
            <button key={label} type="button" style={{ display: 'inline-flex', alignItems: 'center', gap: 6, height: 32, padding: '0 10px', color: i === 0 ? 'var(--text-primary)' : 'var(--text-muted)', background: i === 0 ? 'var(--bg-sunken)' : 'transparent', border: '1px solid ' + (i === 0 ? 'var(--border-default2)' : 'transparent'), borderRadius: 8, cursor: 'default', fontSize: 12.5, fontWeight: i === 0 ? 650 : 500 }}><Icon name={icon} size={13} />{label}</button>
          ))}
        </nav>
        <form onSubmit={search} style={{ display: 'flex', alignItems: 'center', gap: 7, flex: '0 1 300px', minWidth: 120, height: 30, marginLeft: 4, padding: '0 10px', background: 'var(--bg-app)', border: '1px solid var(--border-default2)', borderRadius: 8 }}>
          <span style={{ display: 'inline-flex', color: 'var(--text-muted)' }}><Icon name="search-code" size={14} /></span>
          <input value={query} onChange={(ev) => setQuery(ev.target.value)} placeholder="Find module or area" style={{ flex: 1, minWidth: 0, color: 'var(--text-primary)', background: 'transparent', border: 0, outline: 'none', fontSize: 12.5 }} />
        </form>
        <span style={{ flex: 'none', marginLeft: 'auto', color: 'var(--text-muted)', fontSize: 11.5 }}>topic-similarity-mvp · design example</span>
        <select value="" onChange={(ev) => { const m = MOCKUPS.find((x) => x.id === ev.target.value); if (m) runMockup(m); }} aria-label="Jump to mockup" style={{ flex: 'none', height: 30, maxWidth: 190, padding: '0 8px', color: 'var(--text-primary)', background: 'var(--bg-app)', border: '1px solid var(--border-default2)', borderRadius: 8, fontSize: 11.5 }}>
          <option value="">Mockups…</option>{MOCKUPS.map((m) => <option key={m.id} value={m.id}>{m.label}</option>)}
        </select>
        <div style={{ flex: 'none' }}><ThemeToggle value={theme} onChange={setTheme} /></div>
      </header>

      <div style={{ display: 'flex', alignItems: 'center', gap: 11, padding: '0 16px', background: 'var(--bg-app)', borderBottom: '1px solid var(--border-subtle)' }}>
        <button type="button" onClick={back} disabled={stack.length < 2} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, height: 27, padding: '0 9px', color: stack.length < 2 ? 'var(--text-muted)' : 'var(--text-primary)', background: 'transparent', border: '1px solid var(--border-default2)', borderRadius: 7, cursor: stack.length < 2 ? 'not-allowed' : 'pointer', opacity: stack.length < 2 ? 0.42 : 1, fontSize: 12 }}><Icon name="arrow-left" size={12} />Back</button>
        <nav aria-label="Architecture trail" style={{ display: 'flex', flex: '1 1 auto', alignItems: 'center', gap: 5, minWidth: 0, fontSize: 12 }}>
          {stack.map((c, i) => {
            const last = i === stack.length - 1;
            return <span key={c.id || 'root'} style={{ display: 'inline-flex', alignItems: 'center', gap: 5, minWidth: 0 }}>
              {last ? <strong style={{ overflow: 'hidden', maxWidth: 280, textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{c.label}</strong> : <button type="button" onClick={() => { setStack((s) => s.slice(0, i + 1)); setEntity(null); setSelected(null); }} style={{ padding: 0, color: 'var(--text-muted)', background: 'transparent', border: 0, cursor: 'pointer', fontSize: 12 }}>{c.label}</button>}
              {!last && <span style={{ display: 'inline-flex', color: 'var(--text-muted)' }}><Icon name="chevron-right" size={11} /></span>}
            </span>;
          })}
        </nav>
        <span style={{ flex: 'none', display: 'inline-flex', alignItems: 'center', gap: 5, color: aiOn ? 'var(--ai-text)' : 'var(--text-muted)', fontSize: 10.5, fontWeight: 650, whiteSpace: 'nowrap' }}><Icon name="sparkles" size={11} />AI labels {aiOn ? 'on' : 'off'}</span>
        <button type="button" onClick={() => setInspector((v) => !v)} aria-pressed={inspector} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: 28, height: 28, color: 'var(--text-muted)', background: 'transparent', border: '1px solid var(--border-default2)', borderRadius: 7, cursor: 'pointer' }}><Icon name="panel-right" size={13} /></button>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: inspector ? 'minmax(0,1fr) 280px' : 'minmax(0,1fr)', minWidth: 0, minHeight: 0 }}>
        <div style={{ position: 'relative', minWidth: 0, minHeight: 0, display: 'grid' }}>
          {canvas}
          {(entity || large || view === 'outline' || (scope && G.byId[scope])) && <div style={{ position: 'absolute', right: 14, bottom: 14, zIndex: 90 }}>{controls}</div>}
        </div>
        {inspector && <Inspector node={node} entity={entity} large={large} aiOn={aiOn} onToggleAI={() => setAIOn((v) => !v)} onEnter={enter} />}
      </div>
    </div>
  );
}

function Inspector({ node, entity, large, aiOn, onToggleAI, onEnter }) {
  const wrap = (eyebrow, title, chip, body) => (
    <aside aria-label={title} style={{ display: 'flex', flexDirection: 'column', minWidth: 0, background: 'var(--bg-surface)', borderLeft: '1px solid var(--border-default2)' }}>
      <div style={{ padding: '14px 15px', borderBottom: '1px solid var(--border-subtle)' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}><span style={{ color: 'var(--text-muted)', fontSize: 10.5, fontWeight: 700, letterSpacing: '0.055em', textTransform: 'uppercase' }}>{eyebrow}</span>{chip}</div>
        <h2 style={{ margin: 0, fontSize: 16, lineHeight: 1.25, overflowWrap: 'anywhere' }}>{title}</h2>
      </div>
      <div style={{ flex: 1, minHeight: 0, overflow: 'auto', padding: 15 }}>{body}</div>
    </aside>
  );
  const fact = (l, v) => <div key={l} style={{ display: 'flex', justifyContent: 'space-between', gap: 10, padding: '6px 0', borderBottom: '1px solid var(--border-subtle)', fontSize: 12 }}><span style={{ color: 'var(--text-muted)' }}>{l}</span><span style={{ textAlign: 'right' }}>{v}</span></div>;

  if (entity) return wrap('Entity focus', entity.label, <ProvenanceChip kind="structure" size="sm" label="Module" />, <>{fact('Context', 'Application Services')}{fact('Cluster', 'Structural cluster 1')}{fact('Depended on by', entity.incoming.length)}{fact('Depends on', entity.outgoing.length)}<p style={{ margin: '14px 0 0', color: 'var(--text-muted)', fontSize: 12, lineHeight: 1.55 }}>The center graph is deterministic one-hop context. Verified statements remain a separate evidence-backed layer.</p></>);
  if (large) return wrap('Scale example', '2,014-module repository', <ProvenanceChip kind="structure" size="sm" />, <>{fact('Rendered first', 6)}{fact('Nested regions', 118)}{fact('Structural clusters', 43)}<p style={{ marginTop: 14, color: 'var(--text-muted)', fontSize: 12, lineHeight: 1.55 }}>The map starts at architectural scale. Clusters and modules appear only when the user expands or zooms into a region.</p></>);

  if (!node) return wrap('Architecture map', 'topic-similarity-mvp', <ProvenanceChip kind="structure" size="sm" label="Deterministic base" />, <>
    {fact('Source modules', 142)}{fact('Top-level regions', 3)}{fact('Structural clusters', 5)}{fact('Strong relations shown', 5)}
    <h3 style={{ margin: '18px 0 8px', color: 'var(--text-muted)', fontSize: 10.5, textTransform: 'uppercase', letterSpacing: '0.05em' }}>How to read this</h3>
    <p style={{ margin: 0, color: 'var(--text-secondary)', fontSize: 12, lineHeight: 1.6 }}>Large blue/violet frames are deterministic containment. Teal cluster boxes are deterministic relation groups. Purple labels are optional AI interpretation. Arrows are aggregated real relations.</p>
    <button type="button" onClick={onToggleAI} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, marginTop: 14, padding: '6px 9px', color: aiOn ? 'var(--ai-text)' : 'var(--text-secondary)', background: aiOn ? 'var(--ai-surface)' : 'var(--bg-sunken)', border: '1px solid ' + (aiOn ? 'var(--ai-border)' : 'var(--border-default2)'), borderRadius: 7, cursor: 'pointer', fontSize: 11.5 }}><Icon name="sparkles" size={12} />{aiOn ? 'Hide AI labels' : 'Show AI labels'}</button>
  </>);

  const aiTitle = aiOn && node.ai ? node.ai.name : node.full || node.label;
  const out = G.edges.filter((e) => e.from === node.id), inc = G.edges.filter((e) => e.to === node.id);
  return wrap(node.kind === 'cluster' ? 'Deterministic cluster' : node.kind === 'region' ? 'Structural region' : 'Structural area', aiTitle,
    <ProvenanceChip kind={node.kind === 'cluster' ? 'cluster' : 'structure'} size="sm" />, <>
      {aiOn && node.ai && <div style={{ marginBottom: 14, padding: '9px 10px', color: 'var(--ai-text)', background: 'var(--ai-surface)', border: '1px solid var(--ai-border)', borderRadius: 8, boxShadow: 'inset 3px 0 0 var(--ai-accent)' }}><div style={{ display: 'flex', alignItems: 'center', gap: 5, marginBottom: 5, fontSize: 9.5, fontWeight: 700, textTransform: 'uppercase' }}><Icon name="sparkles" size={10} />AI interpretation</div><div style={{ color: 'var(--text-secondary)', fontSize: 11.5, lineHeight: 1.5 }}>{node.ai.description}</div></div>}
      {fact('Modules', node.count)}{node.relations != null && fact('Internal relations', node.relations)}{node.path && fact('Structural basis', node.path)}
      <h3 style={{ margin: '16px 0 7px', color: 'var(--text-muted)', fontSize: 10.5, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Boundary relations</h3>
      <div style={{ display: 'grid', gap: 6 }}>
        {inc.concat(out).length === 0 && <span style={{ color: 'var(--text-muted)', fontSize: 12 }}>No cross-boundary relation is shown for this selection.</span>}
        {inc.slice(0,3).map((e) => <span key={e.id} style={{ padding: '6px 8px', background: 'var(--bg-sunken)', border: '1px solid var(--border-subtle)', borderRadius: 7, fontSize: 11.5 }}>{e.count} {e.kind} from <strong>{G.byId[e.from].ai && aiOn ? G.byId[e.from].ai.name : G.byId[e.from].label}</strong></span>)}
        {out.slice(0,3).map((e) => <span key={e.id} style={{ padding: '6px 8px', background: 'var(--bg-sunken)', border: '1px solid var(--border-subtle)', borderRadius: 7, fontSize: 11.5 }}>{e.count} {e.kind} to <strong>{G.byId[e.to].ai && aiOn ? G.byId[e.to].ai.name : G.byId[e.to].label}</strong></span>)}
      </div>
      {node.kind !== 'residual' && <Button variant="quiet" style={{ marginTop: 14 }} iconAfter={<Icon name="arrow-right" size={13} />} onClick={() => onEnter(node)}>Enter area</Button>}
    </>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
