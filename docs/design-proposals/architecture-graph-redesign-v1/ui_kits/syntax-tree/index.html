<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>html,body{margin:0;height:100%}body{background:var(--obs-canvas)}#root{height:100vh;overflow:auto}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="./EntryScreen.jsx"></script>
<script type="text/babel" src="./ObservatoryScreen.jsx"></script>
<script type="text/babel">
function App() {
  const [screen, setScreen] = React.useState('entry');
  return screen === 'entry'
    ? <EntryScreen onComplete={() => setScreen('observatory')} />
    : <ObservatoryScreen onRestart={() => setScreen('entry')} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
